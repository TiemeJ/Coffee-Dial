name: Lint getPhotoSignedUrl Function

on:
  push:
    branches: [ "main" ]
    paths:
      - "cloud/google-cloud-functions/getPhotoSignedUrl-function-source/**"
      - ".github/workflows/lint-get-photo-signed-url.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "cloud/google-cloud-functions/getPhotoSignedUrl-function-source/**"
      - ".github/workflows/lint-get-photo-signed-url.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/google-cloud-functions/getPhotoSignedUrl-function-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
