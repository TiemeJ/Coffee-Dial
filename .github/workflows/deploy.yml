---
name: Deploy to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate build info
        run: |
          BUILD_STAMP="$(date -u '+%y-%m-%d %H:%M')"
          COMMIT_SHA="$(git rev-parse --short HEAD)"
          cat > src/config/build-info.js <<EOF
          // Auto-generated in GitHub deploy workflow.
          window.__coffeeDialBuildInfo = {
              buildStamp: '${BUILD_STAMP}',
              commit: '${COMMIT_SHA}'
          };
          EOF
          sed -i "s/__BUILD_INFO_VERSION__/${COMMIT_SHA}/g" index.html

      - name: Build App Bundle
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
