name: Deploy Notifications Functions

on:
  push:
    branches: [ "main" ]
    paths:
      - "cloud/google-cloud-functions/notifications-function-source/**"
      - "firebase.notifications.functions.json"
      - ".github/workflows/deploy-notifications-function.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/google-cloud-functions/notifications-function-source
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  deploy-firebase:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install notifications function dependencies
        run: npm ci
        working-directory: cloud/google-cloud-functions/notifications-function-source

      - name: Verify Firebase config file
        run: |
          CONFIG_PATH="$GITHUB_WORKSPACE/firebase.notifications.functions.json"
          test -f "$CONFIG_PATH"
          echo "Using Firebase config at: $CONFIG_PATH"
          cat "$CONFIG_PATH"

      - name: Deploy via Firebase CLI (onDocumentCreated wrapper flow)
        env:
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
        run: |
          CONFIG_PATH="$GITHUB_WORKSPACE/firebase.notifications.functions.json"
          firebase deploy \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --config="$CONFIG_PATH" \
            --only="functions:notifications" \
            --force
