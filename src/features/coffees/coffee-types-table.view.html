    <!-- Coffee Modal -->
    <div id="coffeeTypesModal" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-[#292524] rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col">
            <div class="p-5 border-b border-coffee-200 dark:border-[#44403c] flex justify-between items-center bg-coffee-50 dark:bg-[#1c1917]">
                <h3 class="font-bold text-xl text-coffee-900 dark:text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-coffee-600 dark:text-[#d6ccc2]"></i> Coffees
                </h3>
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <button type="button" data-action-click="toggleCoffeeTypesAiMenu(event)" id="coffeeTypesAiScanBtn" class="flex items-center gap-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Add
                        </button>
                        <div id="coffeeTypesAiMenuDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden">
                            <button type="button" data-action-click="triggerCoffeeTypesAIScan('camera')" class="w-full text-left px-4 py-2 text-xs hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-2 border-b border-coffee-100 dark:border-[#44403c]">
                                <i class="fa-solid fa-camera w-4"></i> Take Photo
                            </button>
                            <button type="button" data-action-click="triggerCoffeeTypesAIScan('library')" class="w-full text-left px-4 py-2 text-xs hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-2">
                                <i class="fa-solid fa-images w-4"></i> From Gallery
                            </button>
                        </div>
                        <input type="file" id="coffeeTypesAiFileInput" accept="image/*" class="hidden" data-action-change="handleCoffeeTypesAIFile(event)">
                    </div>
                    <button data-action-click="createCoffeeTypeFromModal()" class="px-3 py-1.5 text-xs font-bold rounded bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add
                    </button>
                    <button data-action-click="closeCoffeeTypes()" class="text-gray-500 hover:text-gray-700 dark:text-[#78716c] dark:hover:text-white">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 bg-white dark:bg-[#292524]">
                <div class="rounded-lg border border-coffee-200 dark:border-[#44403c] overflow-hidden">
                    <div class="bg-coffee-100/50 dark:bg-[#1c1917] p-3 space-y-3 border-b border-coffee-200 dark:border-[#44403c]">
                        <div class="flex items-center gap-3">
                            <select id="coffeeTypesViewSelect" data-action-change="changeView(this.value)" class="bg-white dark:bg-[#292524] border border-coffee-100 dark:border-[#44403c] text-coffee-900 dark:text-white text-sm rounded-lg block p-2.5 shadow-sm font-bold min-w-[150px]">
                                <option value="mine">My Coffees</option>
                            </select>
                            <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                    <i class="fa-solid fa-search text-coffee-400"></i>
                                </div>
                                <input id="coffeeTypesSearch" type="text" placeholder="Search coffees..." data-action-input="setCoffeeTypesSearch(this.value)" class="block w-full p-2.5 pl-10 pr-20 text-sm text-coffee-900 border border-coffee-100 rounded-lg bg-white dark:bg-[#292524] dark:border-[#44403c] dark:placeholder-[#57534e] dark:text-white focus:ring-1 focus:ring-coffee-500 focus:border-coffee-500 shadow-sm transition-all">
                                <div class="absolute inset-y-0 right-0 flex items-center pr-1">
                                    <button id="coffeeTypesSearchClearBtn" data-action-click="clearCoffeeTypesSearch()" class="hidden p-2 text-coffee-400 hover:text-coffee-600 dark:hover:text-white transition-colors cursor-pointer">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                    <div class="h-6 w-px bg-coffee-200 dark:bg-[#44403c] mx-1"></div>
                                    <button data-action-click="toggleCoffeeTypesQuickFilter(event)" class="p-2 text-coffee-700 dark:text-[#d6ccc2] hover:text-coffee-900 dark:hover:text-white transition-colors">
                                        <i class="fa-solid fa-filter"></i>
                                    </button>
                                </div>
                                <div id="coffeeTypesQuickFilterDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden">
                                    <div class="px-3 py-2 text-xs font-bold text-coffee-400 dark:text-[#78716c] uppercase border-b border-coffee-100 dark:border-[#44403c]">Filter by</div>
                                </div>
                                <div id="coffeeTypesQuickFilterValuesDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden max-h-80 overflow-y-auto"></div>
                            </div>
                        </div>
                        <div id="coffeeTypesActiveFiltersContainer" class="hidden flex items-center gap-2 flex-wrap">
                            <div class="flex items-center gap-2 flex-wrap" id="coffeeTypesActiveFiltersList"></div>
                            <button data-action-click="clearCoffeeTypesFilters()" class="text-xs text-coffee-600 dark:text-[#a8a29e] hover:text-red-500 whitespace-nowrap px-2 py-1 rounded hover:bg-coffee-50 dark:hover:bg-[#34302e] transition-colors">Clear all</button>
                        </div>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-left text-coffee-900 dark:text-[#e7e5e4]">
                            <thead class="text-xs text-coffee-700 dark:text-[#a8a29e] uppercase bg-coffee-100/50 dark:bg-[#1c1917] border-b border-coffee-200 dark:border-[#44403c]">
                                <tr>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('farmer')" class="flex items-center gap-2">
                                            <span>Farmer</span>
                                            <span id="coffeeTypesSortIcon-farmer" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('roaster')" class="flex items-center gap-2">
                                            <span>Roaster</span>
                                            <span id="coffeeTypesSortIcon-roaster" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('origin')" class="flex items-center gap-2">
                                            <span>Origin</span>
                                            <span id="coffeeTypesSortIcon-origin" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('processing')" class="flex items-center gap-2">
                                            <span>Process</span>
                                            <span id="coffeeTypesSortIcon-processing" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3">
                                        <button type="button" data-action-click="setCoffeeTypesSort('variety')" class="flex items-center gap-2">
                                            <span>Variety</span>
                                            <span id="coffeeTypesSortIcon-variety" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('roast')" class="flex items-center gap-2 mx-auto">
                                            <span>Roast</span>
                                            <span id="coffeeTypesSortIcon-roast" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center">
                                        <button type="button" data-action-click="setCoffeeTypesSort('rating')" class="flex items-center gap-2 mx-auto">
                                            <span>Rating</span>
                                            <span id="coffeeTypesSortIcon-rating" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center w-28">
                                        <button type="button" data-action-click="setCoffeeTypesSort('createdAt')" class="flex items-center gap-2 mx-auto">
                                            <span>Created</span>
                                            <span id="coffeeTypesSortIcon-createdAt" class="text-[10px]"></span>
                                        </button>
                                    </th>
                                    <th class="px-4 py-3 text-center w-12"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody id="coffeeTypesTableBody" class="divide-y divide-coffee-50 dark:divide-[#1c1917]"></tbody>
                        </table>
                    </div>
                    <div id="coffeeTypesEmpty" class="hidden text-center py-8 text-coffee-400 dark:text-[#57534e] bg-white dark:bg-[#292524]">
                        <p>No coffees saved yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
