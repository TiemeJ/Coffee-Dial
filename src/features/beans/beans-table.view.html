<!-- Beans Management Modal -->
<div id="beansModal" data-feature-root="beans" class="hidden fixed inset-0 z-[10040] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-[#292524] rounded-xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col">
        <div class="p-5 border-b border-coffee-200 dark:border-[#44403c] flex justify-between items-center bg-coffee-50 dark:bg-[#1c1917]">
            <h3 class="font-bold text-xl text-coffee-900 dark:text-white flex items-center gap-2">
                <i class="fa-solid fa-seedling text-green-600"></i> Coffee beans
            </h3>
            <div class="flex items-center gap-2">
                <div class="relative">
                    <button type="button" data-action-click="toggleBeansAiMenu(event)" id="beansAiScanBtn" class="flex items-center gap-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition-all shadow-sm">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Add
                    </button>
                    <div id="beansAiMenuDropdown" class="hidden absolute right-0 mt-2 w-40 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden">
                        <button type="button" data-action-click="triggerBeansAIScan('camera')" class="w-full text-left px-4 py-2 text-xs hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-2 border-b border-coffee-100 dark:border-[#44403c]">
                            <i class="fa-solid fa-camera w-4"></i> Take Photo
                        </button>
                        <button type="button" data-action-click="triggerBeansAIScan('library')" class="w-full text-left px-4 py-2 text-xs hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-2">
                            <i class="fa-solid fa-images w-4"></i> From Gallery
                        </button>
                    </div>
                    <input type="file" id="beansAiFileInput" accept="image/*" class="hidden" data-action-change="handleBeansAIFile(event)">
                </div>
                <button data-action-click="createBeanFromModal()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded font-bold transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add
                </button>
                <button data-action-click="closeBeans()" class="text-gray-500 hover:text-gray-700 dark:text-[#78716c] dark:hover:text-white ml-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-4 bg-white dark:bg-[#292524]">
            <div class="rounded-lg border border-coffee-200 dark:border-[#44403c] overflow-hidden">
                <div class="bg-coffee-100/50 dark:bg-[#1c1917] p-1.5 space-y-1.5 border-b border-coffee-200 dark:border-[#44403c]">
                    <div class="flex items-center gap-1.5">
                        <select id="beansViewSelect" data-action-change="beansChangeView(this.value)" class="bg-white dark:bg-[#292524] border border-coffee-100 dark:border-[#44403c] text-coffee-900 dark:text-white text-sm rounded-lg block p-2.5 shadow-sm font-bold min-w-[150px]">
                            <option value="mine">My beans</option>
                        </select>
                        <div class="relative flex-1">
                            <input id="beansSearch" type="text" placeholder="Search beans..." data-action-input="setBeansSearch(this.value)" class="block w-full p-2.5 pl-3 pr-20 text-sm text-coffee-900 border border-coffee-100 rounded-lg bg-white dark:bg-[#292524] dark:border-[#44403c] dark:placeholder-[#57534e] dark:text-white focus:ring-1 focus:ring-coffee-500 focus:border-coffee-500 shadow-sm transition-all">
                            <div class="absolute inset-y-0 right-0 flex items-center pr-1">
                                <button id="beansSearchClearBtn" data-action-click="clearBeansSearch()" class="hidden p-2 text-coffee-400 hover:text-coffee-600 dark:hover:text-white transition-colors cursor-pointer">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                                <div class="h-6 w-px bg-coffee-200 dark:bg-[#44403c] mx-1"></div>
                                <button data-action-click="toggleBeansQuickFilter(event)" class="p-2 text-coffee-700 dark:text-[#d6ccc2] hover:text-coffee-900 dark:hover:text-white transition-colors">
                                    <i class="fa-solid fa-filter"></i>
                                </button>
                            </div>
                            <div id="beansQuickFilterDropdown" class="hidden absolute right-0 mt-2 w-72 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden"></div>
                            <div id="beansQuickFilterValuesDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-50 overflow-hidden max-h-80 overflow-y-auto"></div>
                        </div>
                    </div>
                    <div id="beansActiveFiltersContainer" class="hidden flex items-center gap-2 flex-wrap">
                        <div class="flex items-center gap-2 flex-wrap" id="beansActiveFiltersList"></div>
                        <button data-action-click="clearBeansFilters()" class="text-xs text-coffee-600 dark:text-[#a8a29e] hover:text-red-500 whitespace-nowrap px-2 py-1 rounded hover:bg-coffee-50 dark:hover:bg-[#34302e] transition-colors">Clear all</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-coffee-900 dark:text-[#e7e5e4]">
                        <thead class="text-xs text-coffee-700 dark:text-[#a8a29e] uppercase bg-coffee-100/50 dark:bg-[#1c1917] border-b border-coffee-200 dark:border-[#44403c]">
                            <tr>
                                <th class="px-4 py-3">
                                    <button type="button" data-action-click="setBeansSort('farmer')" class="flex items-center gap-2">
                                        <span>Farmer / Roaster</span>
                                        <span id="beansSortIcon-farmer" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3">
                                    <button type="button" data-action-click="setBeansSort('origin')" class="flex items-center gap-2">
                                        <span>Origin / Region</span>
                                        <span id="beansSortIcon-origin" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3">
                                    <button type="button" data-action-click="setBeansSort('processing')" class="flex items-center gap-2">
                                        <span>Process / Variety</span>
                                        <span id="beansSortIcon-processing" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-16">
                                    <button type="button" data-action-click="setBeansSort('decaf')" class="flex items-center gap-2 mx-auto">
                                        <span>Decaf</span>
                                        <span id="beansSortIcon-decaf" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center">
                                    <button type="button" data-action-click="setBeansSort('roastType')" class="flex items-center gap-2 mx-auto">
                                        <span>Roast</span>
                                        <span id="beansSortIcon-roastType" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-24">
                                    <button type="button" data-action-click="setBeansSort('price')" class="flex items-center gap-2 mx-auto">
                                        <span>Price (€)</span>
                                        <span id="beansSortIcon-price" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-24">
                                    <button type="button" data-action-click="setBeansSort('stock')" class="flex items-center gap-2 mx-auto">
                                        <span>Weight (g)</span>
                                        <span id="beansSortIcon-stock" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-20">
                                    <button type="button" data-action-click="setBeansSort('brews')" class="flex items-center gap-2 mx-auto">
                                        <span>Brews</span>
                                        <span id="beansSortIcon-brews" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-24">
                                    <button type="button" data-action-click="setBeansSort('beansLeft')" class="flex items-center gap-2 mx-auto">
                                        <span>Beans left</span>
                                        <span id="beansSortIcon-beansLeft" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-32">
                                    <button type="button" data-action-click="setBeansSort('roastDate')" class="flex items-center gap-2 mx-auto">
                                        <span>Roast date</span>
                                        <span id="beansSortIcon-roastDate" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-32">
                                    <button type="button" data-action-click="setBeansSort('frozenDate')" class="flex items-center gap-2 mx-auto">
                                        <span>Frozen date</span>
                                        <span id="beansSortIcon-frozenDate" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-32">
                                    <button type="button" data-action-click="setBeansSort('openedDate')" class="flex items-center gap-2 mx-auto">
                                        <span>Opened date</span>
                                        <span id="beansSortIcon-openedDate" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-32">
                                    <button type="button" data-action-click="setBeansSort('archivedDate')" class="flex items-center gap-2 mx-auto">
                                        <span>Archived date</span>
                                        <span id="beansSortIcon-archivedDate" class="text-[10px]"></span>
                                    </button>
                                </th>
                                <th class="px-4 py-3 text-center w-24">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="beansTableBody" class="divide-y divide-coffee-50 dark:divide-[#1c1917]"></tbody>
                    </table>
                </div>
                <div id="beansEmpty" class="hidden text-center py-8 text-coffee-400 dark:text-[#57534e] bg-white dark:bg-[#292524]">
                    <p>No beans saved yet.</p>
                </div>
            </div>
        </div>
    </div>
</div>
