<div id="galleryModal" class="hidden fixed inset-0 z-[75] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="relative bg-white dark:bg-[#292524] rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col">
        <div class="flex border-b border-coffee-200 dark:border-[#44403c]">
            <button data-action-click="switchGalleryTab('shared')" id="tabGalleryShared" class="flex-1 py-3 text-sm font-semibold text-coffee-700 dark:text-[#d6ccc2] bg-coffee-50 dark:bg-[#1c1917]">Friends' moments</button>
            <button data-action-click="switchGalleryTab('mine')" id="tabGalleryMine" class="flex-1 py-3 text-sm font-semibold text-coffee-500 dark:text-[#78716c] hover:bg-coffee-50 dark:hover:bg-[#1c1917]">My moments</button>
            <button data-action-click="hideGalleryModal()" class="px-4 text-gray-500 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="galleryLoading" class="hidden absolute left-0 right-0 bottom-0 top-12 z-20 flex flex-col items-center justify-center gap-3 bg-coffee-50/85 dark:bg-[#1c1917]/85 backdrop-blur-[1px] text-coffee-600 dark:text-[#a8a29e]">
            <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
            <p class="text-sm font-medium">Loading moments...</p>
        </div>
        <div id="galleryContent" class="p-4 overflow-y-auto ios-scroll flex-1 bg-coffee-50 dark:bg-[#1c1917]">
            <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
            <div id="galleryLoadMore" class="text-center py-4 hidden">
                <button data-action-click="loadMoreGallery()" class="bg-coffee-100 dark:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] px-6 py-2 rounded-full text-sm font-bold shadow-sm hover:bg-coffee-200 dark:hover:bg-[#44403c] transition-colors">Load More <i class="fa-solid fa-chevron-down ml-2"></i></button>
            </div>
            <div id="galleryEmpty" class="hidden text-center py-10 text-coffee-400 dark:text-[#57534e]">
                <i class="fa-solid fa-images text-4xl mb-2"></i>
                <p>No moments found.</p>
            </div>
        </div>
    </div>
</div>
