<div id="signedOutAuthBody" class="hidden flex justify-center">
    <div class="w-full max-w-2xl space-y-4">
        <div class="w-full bg-white dark:bg-[#292524] rounded-xl shadow-lg border border-coffee-100 dark:border-[#44403c] p-6">
            <h2 class="text-lg font-bold text-coffee-900 dark:text-white mb-1">Sign in / register</h2>
            <p class="text-sm text-coffee-600 dark:text-[#a8a29e] mb-4">Create an account or sign in to sync your brews, beans, and preferences across devices.</p>
            <button data-action-click="googleLogin()" class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium transition-colors">
                <i class="fa-brands fa-google"></i>
                <span>Sign in / register</span>
            </button>
        </div>
        <div id="signedOutHelpCardMount" class="w-full"></div>
        <details class="w-full group">
            <summary class="list-none cursor-pointer text-xs text-gray-500 dark:text-[#78716c] hover:text-gray-700 dark:hover:text-[#a8a29e] select-none inline-flex items-center gap-1">
                <i class="fa-solid fa-angle-right text-[10px] transition-transform group-open:rotate-90"></i>
                <span>Sign in with email link</span>
            </summary>
            <div class="w-full bg-white dark:bg-[#292524] rounded-xl shadow-lg border border-coffee-100 dark:border-[#44403c] p-6 mt-2">
                <p class="text-xs text-coffee-500 dark:text-[#78716c] mb-4">On devices that don't support sign in throught the sign in button, use an email link to sign in without a password.</p>
                <div class="flex items-center gap-2">
                    <input id="emailLinkLoginEmail" type="email" placeholder="Email for link" class="flex-1 bg-white dark:bg-[#1c1917] border border-coffee-200 dark:border-[#44403c] rounded-lg px-3 py-2 text-sm text-coffee-900 dark:text-white focus:border-coffee-500 transition-colors">
                    <button id="emailLinkLoginBtn" data-action-click="sendEmailLinkLogin()" class="px-3 py-2 rounded-lg bg-coffee-700 hover:bg-coffee-800 dark:bg-[#57534e] text-white text-xs font-semibold transition-colors">Email link</button>
                </div>
                <div id="emailLinkLoginStatus" class="hidden text-[11px] text-coffee-600 dark:text-[#a8a29e] mt-2"></div>
            </div>
        </details>
    </div>
</div>
