    <!-- Other Modals -->
    <div id="modalOverlay" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-[#292524] rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] min-h-[70vh] overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col">
            <div class="flex border-b border-coffee-200 dark:border-[#44403c]">
                <button data-action-click="switchModalTab('profile')" id="tabProfile" class="flex-1 py-3 text-sm font-semibold text-coffee-700 dark:text-[#d6ccc2] bg-coffee-50 dark:bg-[#1c1917]">My Profile</button>
                <button data-action-click="switchModalTab('following')" id="tabFollowing" class="flex-1 py-3 text-sm font-semibold text-coffee-500 dark:text-[#78716c] hover:bg-coffee-50 dark:hover:bg-[#1c1917]">Following</button>
            </div>
            <div id="contentProfile" class="p-6 flex-1 overflow-y-auto">

                <hr class="my-6 border-coffee-200 dark:border-[#44403c]">
                <div class="text-xs font-semibold text-coffee-500 dark:text-[#78716c] uppercase mb-2">Followers</div>
                <div id="followersList" class="space-y-2 max-h-48 overflow-y-auto mb-4"></div>
                <hr class="my-6 border-coffee-200 dark:border-[#44403c]">
                <button data-action-click="googleLogout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 dark:bg-red-900/20 dark:hover:bg-red-900/30 dark:text-red-300 py-2 rounded-lg text-sm font-medium">Sign Out</button>
            </div>
            <div id="contentFollowing" class="hidden p-6 flex-1 overflow-y-auto">
                <div class="flex gap-2 mb-4"><input type="text" id="friendIdInput" placeholder="Enter Friend's Share ID" class="flex-1 bg-coffee-50 dark:bg-[#1c1917] border border-coffee-200 dark:border-[#44403c] rounded-lg px-3 py-2 text-sm text-coffee-900 dark:text-white"><button data-action-click="followUser()" class="bg-coffee-700 hover:bg-coffee-800 dark:bg-[#57534e] text-white px-3 py-2 rounded-lg text-sm font-medium">Follow</button></div>
                <div class="text-xs font-semibold text-coffee-500 dark:text-[#78716c] uppercase mb-2">People you follow</div>
                <div id="followingList" class="space-y-2 max-h-48 overflow-y-auto"></div>
            </div>
            <div class="bg-coffee-50 dark:bg-[#1c1917] px-6 py-3 flex justify-end"><button data-action-click="closeModal()" class="text-sm font-medium text-coffee-600 dark:text-[#a8a29e] hover:text-coffee-900 dark:hover:text-white">Close</button></div>
        </div>
    </div>
