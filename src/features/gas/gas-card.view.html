<div id="gasCardOverlay" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" data-action-click="closeGasCard(event)">
    <div id="gasCardPanel" class="bg-white dark:bg-[#292524] w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col max-h-[85vh]" data-action-click="handleGasCardOverlayClick(event)">
        <div class="bg-coffee-100 dark:bg-[#1c1917] p-4 border-b border-coffee-200 dark:border-[#44403c] relative">
            <div class="absolute top-4 right-4 flex items-center gap-2">
                <button id="gasCardEditBtn" data-action-click="enterGasEditMode()" class="text-coffee-400 hover:text-coffee-800 dark:text-[#57534e] dark:hover:text-white transition-colors" title="Edit">
                    <i class="fa-solid fa-pen-to-square text-lg"></i>
                </button>
                <button data-action-click="closeGasCard(null)" class="text-coffee-400 hover:text-coffee-800 dark:text-[#57534e] dark:hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="absolute right-4 top-full mt-2 flex flex-col items-center z-[10001]">
                <button id="gasCardMenuBtn" data-action-click="toggleActionMenu('gasCardActionMenu', event)" class="action-menu-toggle text-coffee-400 hover:text-coffee-800 dark:text-[#57534e] dark:hover:text-white transition-colors" title="Actions">
                    <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                </button>
                <div id="gasCardActionMenu" class="action-menu hidden absolute right-0 top-full mt-2 w-48 bg-white dark:bg-[#292524] rounded-lg shadow-xl border border-coffee-200 dark:border-[#57534e] z-[10000] overflow-hidden" data-action-click="event.stopPropagation()">
                    <button data-action-click="enterGasEditMode()" class="w-full text-left px-4 py-2 text-sm hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-3">
                        <i class="fa-solid fa-pen-to-square text-blue-500 w-4"></i> Edit
                    </button>
                    <button data-action-click="showBrewsForGear()" class="w-full text-left px-4 py-2 text-sm hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-3">
                        <i class="fa-solid fa-mug-saucer text-indigo-600 w-4"></i> Go to brews
                    </button>
                    <button data-action-click="openGasBulkAddModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-3">
                        <i class="fa-solid fa-layer-group text-teal-600 w-4"></i> Bulk add to
                    </button>
                    <button data-action-click="openGasMergeModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-3">
                        <i class="fa-solid fa-code-merge text-purple-500 w-4"></i> Merge
                    </button>
                    <button id="gasCardActionArchiveBtn" data-action-click="toggleGasArchive()" class="w-full text-left px-4 py-2 text-sm hover:bg-coffee-50 dark:hover:bg-[#34302e] text-coffee-700 dark:text-[#d6ccc2] flex items-center gap-3">
                        <i class="fa-solid fa-box-archive text-amber-600 w-4"></i> Archive
                    </button>
                    <hr class="border-coffee-100 dark:border-[#44403c]">
                    <button data-action-click="deleteGasItem()" class="w-full text-left px-4 py-2 text-sm hover:bg-red-50 dark:hover:bg-red-900/20 text-red-600 dark:text-red-400 flex items-center gap-3">
                        <i class="fa-solid fa-trash w-4"></i> Delete
                    </button>
                </div>
            </div>
            <h3 id="gasCardTitle" class="text-lg font-bold text-coffee-900 dark:text-white"></h3>
            <p id="gasCardSubtitle" class="text-xs text-coffee-500 dark:text-[#a8a29e]"></p>
        </div>

        <div id="gasCardView" class="flex-1 flex flex-col min-h-0">
            <div class="space-y-4 flex-1 overflow-y-auto ios-scroll p-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="w-36 md:w-40 lg:w-48">
                        <div id="gasCardImageSection" class="relative w-full aspect-[3/4] bg-coffee-50 dark:bg-[#1c1917] rounded-xl overflow-hidden border border-coffee-100 dark:border-[#44403c] group">
                            <img id="gasCardImage" class="absolute inset-0 w-full h-full object-contain hidden cursor-pointer" src="" alt="Gear Photo" data-action-click="openGasPhoto(event)">
                            <div id="gasCardImagePlaceholder" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-coffee-400 dark:text-[#57534e]">
                                <i class="fa-solid fa-image text-3xl mb-2"></i>
                                <p class="text-xs font-medium">Add / Change picture</p>
                            </div>
                            <div class="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center" data-action-click="triggerGasPhoto(event)" title="Change photo">
                                    <i class="fa-solid fa-camera"></i>
                                </button>
                                <button class="bg-black/50 text-white w-8 h-8 rounded-full flex items-center justify-center" data-action-click="removeGasPhoto(event)" title="Remove photo">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <input type="file" id="gasPhotoInput" accept="image/*" class="hidden" data-action-change="handleGasPhoto(event)">
                    </div>
                    <div class="flex-1 space-y-4">
                        <div class="grid grid-cols-2 gap-3 text-sm">
                            <div>
                                <span class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Type</span>
                                <span id="gasCardType" class="font-medium text-coffee-800 dark:text-[#d6ccc2]"></span>
                            </div>
                            <div>
                                <span class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Price</span>
                                <span id="gasCardPrice" class="font-medium text-coffee-800 dark:text-[#d6ccc2]"></span>
                            </div>
                            <div>
                                <span class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Archived</span>
                                <span id="gasCardArchived" class="font-medium text-coffee-800 dark:text-[#d6ccc2]"></span>
                            </div>
                        </div>
                        <div>
                            <span class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Purchased Date</span>
                            <span id="gasCardCreated" class="text-xs text-coffee-600 dark:text-[#a8a29e]"></span>
                        </div>
                        <div>
                            <span class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Methods</span>
                            <span id="gasCardMethods" class="text-xs text-coffee-700 dark:text-[#d6ccc2]"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-3 border-t border-coffee-100 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] px-4 pb-4">
                <div class="flex justify-end gap-2">
                    <button id="gasCardPrevBtn" class="w-9 h-9 rounded-full border border-coffee-200 dark:border-[#44403c] text-coffee-600 dark:text-[#a8a29e] hover:bg-coffee-50 dark:hover:bg-[#34302e] transition-colors flex items-center justify-center" title="Previous" data-action-click="navigateGasCard(-1)">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <button id="gasCardNextBtn" class="w-9 h-9 rounded-full border border-coffee-200 dark:border-[#44403c] text-coffee-600 dark:text-[#a8a29e] hover:bg-coffee-50 dark:hover:bg-[#34302e] transition-colors flex items-center justify-center" title="Next" data-action-click="navigateGasCard(1)">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="gasCardEdit" class="hidden flex-1 flex flex-col min-h-0">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 content-start flex-1 overflow-y-auto ios-scroll p-4">
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Name</label>
                    <input id="gasEditName" type="text" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Price</label>
                    <input id="gasEditPrice" type="number" step="0.01" min="0" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Purchased Date</label>
                    <input id="gasEditPurchasedDate" type="date" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase">Type</label>
                    <select id="gasEditType" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                        <option value="Basket">Basket</option>
                        <option value="Burrs">Burrs</option>
                        <option value="Coffee maker">Coffee maker</option>
                        <option value="Distributor">Distributor</option>
                        <option value="Dripper">Dripper</option>
                        <option value="Filter">Filter</option>
                        <option value="Grinder">Grinder</option>
                        <option value="Other">Other</option>
                        <option value="Tamper">Tamper</option>
                        <option value="Water">Water</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase mb-2">Methods</label>
                    <div id="gasMethodsMultiSelect" class="relative">
                        <div id="gasMethodsControl" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white min-h-[42px] flex flex-wrap items-center gap-1 cursor-text">
                            <div id="gasMethodsPills" class="flex flex-wrap items-center gap-1"></div>
                            <input id="gasMethodsSearch" type="text" placeholder="Search methods..." class="flex-1 min-w-[120px] bg-transparent border-0 outline-none p-0 text-sm text-coffee-900 dark:text-white placeholder-coffee-400 dark:placeholder-[#57534e]">
                        </div>
                        <div id="gasMethodsDropdown" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white dark:bg-[#292524] border border-coffee-200 dark:border-[#57534e] rounded-lg shadow-xl z-[10020]"></div>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-3 border-t border-coffee-100 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] px-4 pb-4">
                <button data-action-click="cancelGasEditMode()" class="px-3 py-1.5 text-xs font-bold rounded border border-coffee-200 dark:border-[#44403c] text-coffee-700 dark:text-[#d6ccc2] hover:bg-coffee-50 dark:hover:bg-[#34302e]">Cancel</button>
                <button data-action-click="saveGasEdits()" class="px-3 py-1.5 text-xs font-bold rounded bg-indigo-600 hover:bg-indigo-700 text-white">Save</button>
            </div>
        </div>
    </div>
</div>

<div id="gasBulkAddModal" class="hidden fixed inset-0 z-[10020] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" data-action-click="closeGasBulkAddModal(event)">
    <div class="bg-white dark:bg-[#292524] w-full max-w-sm min-h-[56vh] rounded-2xl shadow-2xl overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col" data-action-click="event.stopPropagation()">
        <div class="p-4 border-b border-coffee-200 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] flex items-center justify-between">
            <h3 class="text-sm font-bold text-coffee-900 dark:text-white"><i class="fa-solid fa-layer-group text-teal-600 mr-2"></i>Bulk add to brews</h3>
            <button data-action-click="closeGasBulkAddModal(null)" class="text-coffee-400 hover:text-coffee-800 dark:text-[#57534e] dark:hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="p-4 space-y-3 flex-1">
            <p class="text-xs text-coffee-600 dark:text-[#a8a29e]">Add <span id="gasBulkSourceLabel" class="font-semibold text-coffee-800 dark:text-[#d6ccc2]">this gear item</span> to brews that match all selected criteria.</p>
            <div>
                <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase mb-1">Method</label>
                <select id="gasBulkMethodSelect" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                    <option value="">Any method</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase mb-1">Drink</label>
                <select id="gasBulkDrinkSelect" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                    <option value="">Any drink</option>
                </select>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase mb-1">Gear</label>
                <div id="gasBulkGearFilterMultiSelect" class="relative">
                    <div id="gasBulkGearFilterControl" class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white min-h-[42px] flex flex-wrap items-center gap-1 cursor-text">
                        <div id="gasBulkGearFilterPills" class="flex flex-wrap items-center gap-1"></div>
                        <input id="gasBulkGearFilterSearch" type="text" placeholder="Search gear..." class="flex-1 min-w-[120px] bg-transparent border-0 outline-none p-0 text-sm text-coffee-900 dark:text-white placeholder-coffee-400 dark:placeholder-[#57534e]">
                    </div>
                    <div id="gasBulkGearFilterDropdown" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white dark:bg-[#292524] border border-coffee-200 dark:border-[#57534e] rounded-lg shadow-xl z-[10030]"></div>
                </div>
            </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-coffee-100 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] px-4 pb-4">
            <button data-action-click="closeGasBulkAddModal(null)" class="px-3 py-1.5 text-xs font-bold rounded border border-coffee-200 dark:border-[#44403c] text-coffee-700 dark:text-[#d6ccc2] hover:bg-coffee-50 dark:hover:bg-[#34302e]">Cancel</button>
            <button id="gasBulkAddConfirmBtn" data-action-click="bulkAddGearToBrews()" class="px-3 py-1.5 text-xs font-bold rounded bg-teal-600 hover:bg-teal-700 text-white">Bulk add</button>
        </div>
    </div>
</div>

<div id="gasMergeModal" class="hidden fixed inset-0 z-[10020] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4" data-action-click="closeGasMergeModal(event)">
    <div class="bg-white dark:bg-[#292524] w-full max-w-sm min-h-[44vh] rounded-2xl shadow-2xl overflow-hidden border border-coffee-200 dark:border-[#44403c] flex flex-col" data-action-click="event.stopPropagation()">
        <div class="p-4 border-b border-coffee-200 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] flex items-center justify-between">
            <h3 class="text-sm font-bold text-coffee-900 dark:text-white"><i class="fa-solid fa-code-merge text-purple-500 mr-2"></i>Merge gear item</h3>
            <button data-action-click="closeGasMergeModal(null)" class="text-coffee-400 hover:text-coffee-800 dark:text-[#57534e] dark:hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="p-4 space-y-3 flex-1">
            <p class="text-xs text-coffee-600 dark:text-[#a8a29e]">Merging will move all brew gear links from <span id="gasMergeSourceLabel" class="font-semibold text-coffee-800 dark:text-[#d6ccc2]">this gear item</span> to the selected item and then delete the source item.</p>
            <div>
                <label class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] uppercase mb-1">Merge with</label>
                <div class="relative">
                    <input id="gasMergeTargetSearch" type="text" placeholder="Search gear..." class="w-full text-sm border border-coffee-200 dark:border-[#44403c] rounded p-2 bg-white dark:bg-[#1c1917] text-coffee-900 dark:text-white">
                    <div id="gasMergeTargetDropdown" class="hidden absolute left-0 right-0 mt-1 max-h-48 overflow-y-auto bg-white dark:bg-[#292524] border border-coffee-200 dark:border-[#57534e] rounded-lg shadow-xl z-[10030]"></div>
                </div>
            </div>
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-coffee-100 dark:border-[#44403c] bg-coffee-50 dark:bg-[#1c1917] px-4 pb-4">
            <button data-action-click="closeGasMergeModal(null)" class="px-3 py-1.5 text-xs font-bold rounded border border-coffee-200 dark:border-[#44403c] text-coffee-700 dark:text-[#d6ccc2] hover:bg-coffee-50 dark:hover:bg-[#34302e]">Cancel</button>
            <button id="gasMergeConfirmBtn" data-action-click="mergeGasItem()" class="px-3 py-1.5 text-xs font-bold rounded bg-purple-600 hover:bg-purple-700 text-white">Merge</button>
        </div>
    </div>
</div>
