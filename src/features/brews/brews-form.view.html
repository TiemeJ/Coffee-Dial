                                    <div class="flex justify-between items-end mb-1">

                                        <button type="button" data-action-click="openScaWheelLightbox()" class="text-xs text-blue-500 hover:underline dark:text-blue-400 mr-auto ml-2"><i class="fa-solid fa-image mr-1"></i>View wheel</button>
                                        <div class="flex bg-coffee-100 dark:bg-[#44403c] rounded p-0.5">
                                            <button type="button" data-action-click="setNotesMode('manual')" id="btnNotesManual" class="px-2 py-0.5 text-[10px] rounded font-bold transition-all bg-white dark:bg-[#1c1917] shadow-sm text-coffee-800 dark:text-white">Text</button>
                                            <button type="button" data-action-click="setNotesMode('sca')" id="btnNotesSCA" class="px-2 py-0.5 text-[10px] rounded font-bold transition-all text-coffee-500 dark:text-[#a8a29e] hover:text-coffee-700">SCA Wheel</button>

                                    </div>

                                    <div id="notesSCAContainer" class="hidden mt-2 bg-coffee-50 dark:bg-[#1c1917] border border-coffee-200 dark:border-[#44403c] rounded-lg p-3">

                                        <div id="scaButtonsContainer" class="flex flex-wrap gap-2"></div>

                                    <input type="hidden" id="notesMode" name="notesMode" value="manual">

                                    </div>
                                </div>

                        </details>

                </form>

            <div id="ratioCalcModal" class="hidden fixed inset-0 z-[10055] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" data-action-click="closeRatioCalcModal()">
                <div class="bg-white dark:bg-[#292524] rounded-2xl shadow-2xl w-full max-w-sm mx-auto border border-coffee-200 dark:border-[#44403c]" data-action-click="event.stopPropagation()">
                    <div class="flex justify-between items-center px-5 pt-5 pb-3 border-b border-coffee-100 dark:border-[#44403c]">

                        <button type="button" data-action-click="closeRatioCalcModal()" aria-label="Close ratio calculator" title="Close" class="w-11 h-11 flex items-center justify-center rounded-full text-coffee-500 dark:text-[#a8a29e] hover:bg-coffee-100 dark:hover:bg-[#44403c] transition-colors"><i class="fa-solid fa-xmark"></i></button>

                            <div class="col-span-1">

                                <input type="number" step="any" inputmode="decimal" id="ratioCalcIn" aria-label="Dose in grams" data-action-input="handleRatioCalcInput('in')" placeholder="18" class="w-full text-center font-mono bg-white dark:bg-[#1c1917] border border-coffee-200 dark:border-[#44403c] rounded-lg px-2 py-2 text-sm text-coffee-900 dark:text-white focus:ring-1 focus:ring-coffee-500 focus:outline-none">
                            </div>
                            <!-- Ratio -->
                            <div class="col-span-2">
                                <label for="ratioCalcRatio" class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] mb-1 uppercase text-center">Ratio</label>
                                <div class="flex items-center border border-coffee-200 dark:border-[#44403c] rounded-lg bg-white dark:bg-[#1c1917] focus-within:ring-1 focus-within:ring-coffee-500 px-2 py-2">
                                    <span class="text-sm font-mono text-coffee-400 dark:text-[#78716c] select-none shrink-0 mr-1">1 :</span>
                                    <input type="number" step="any" inputmode="decimal" id="ratioCalcRatio" aria-label="Ratio multiplier" data-action-input="handleRatioCalcInput('ratio')" placeholder="10.5" class="w-0 flex-1 min-w-0 text-center bg-transparent border-0 p-0 text-sm font-mono text-coffee-900 dark:text-white focus:ring-0 focus:outline-none">
                                </div>
                            </div>
                            <!-- Out -->
                            <div class="col-span-1">
                                <label for="ratioCalcOut" class="block text-[10px] font-bold text-coffee-500 dark:text-[#78716c] mb-1 uppercase text-center">Out (g)</label>
                                <input type="number" step="any" inputmode="decimal" id="ratioCalcOut" aria-label="Yield in grams" data-action-input="handleRatioCalcInput('out')" placeholder="189" class="w-full text-center font-mono bg-white dark:bg-[#1c1917] border border-coffee-200 dark:border-[#44403c] rounded-lg px-2 py-2 text-sm text-coffee-900 dark:text-white focus:ring-1 focus:ring-coffee-500 focus:outline-none">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
